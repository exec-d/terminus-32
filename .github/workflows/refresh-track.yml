name: Refresh tracé et décor ligne 32

# Extrait depuis OpenStreetMap le tracé des voies (`track/line32.json`) et le
# décor de la carte — cours d'eau et plans d'eau (`context/line32.json`).
# Cf. exec-d/terminus#89.
#
# Les deux vont ensemble : même source, même licence, même raison de ne bouger
# qu'à la demande. Un run les régénère tous les deux, et le résumé montre les
# deux diffs.
#
# **Manuel seulement, et c'est délibéré.** Les autres chaînes de ce dépôt sont
# planifiées parce que leur donnée bouge : les horaires changent chaque semaine,
# la ponctualité toutes les demi-heures. Une voie ferrée, non. Ce qui bouge, en
# revanche, c'est OpenStreetMap : un contributeur peut scinder une voie ou
# corriger un tracé n'importe quand. Un cron committerait ces retouches sans que
# personne ne les regarde, et l'app afficherait un train ailleurs du jour au
# lendemain. Ici, quelqu'un lance le run et lit le résumé avant de garder.
#
# Les garde-fous d'`extract_track.py` font échouer le run plutôt que d'écrire un
# tracé douteux : gare trop loin du rail, gares non reliées, longueur hors de
# proportion avec la distance à vol d'oiseau.
on:
  workflow_dispatch:
  # TEMPORAIRE — à retirer avant de fusionner. Un `workflow_dispatch` n'est
  # déclenchable que si le fichier existe sur la branche par défaut : sans ce
  # `push`, l'extracteur de décor ne pourrait pas tourner une seule fois contre
  # le vrai Overpass avant d'être fusionné. Le filtre de chemins exclut les
  # sorties, pour que le commit produit par le run ne redéclenche pas le run.
  push:
    branches: [claude/trains-multi-day-display-sfentv]
    paths:
      - 'tools/extract_track.py'
      - 'tools/extract_context.py'
      - '.github/workflows/refresh-track.yml'

permissions:
  contents: write

concurrency:
  group: refresh-track
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # L'extracteur n'utilise que la bibliothèque standard ; `requirements.txt`
      # est installé pour rester cohérent avec les autres workflows du dépôt.
      - name: Dépendances
        run: pip install -r tools/requirements.txt

      - name: Extraction du tracé
        run: |
          {
            echo '## Tracé extrait'
            echo
            echo '```'
            python tools/extract_track.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Extraction du décor
        run: |
          {
            echo '## Décor extrait'
            echo
            echo '```'
            python tools/extract_context.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Le diff est ce qu'on relit : un tracé qui change de longueur ou de
      # nombre de points l'annonce ici, avant le commit.
      - name: Écart avec le tracé publié
        if: always()
        run: |
          {
            echo '## Écart'
            echo
            echo '```'
            git diff --stat -- track/ context/ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit si changement
        run: |
          git add track context
          if git diff --cached --quiet; then
            echo "tracé et décor inchangés"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: tracé et décor de la ligne 32 depuis OpenStreetMap"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
