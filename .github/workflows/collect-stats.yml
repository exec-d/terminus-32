name: Collecte ponctualité ligne 32

# Le flux GTFS-RT ne retient PAS la journée de service écoulée : un train n'y
# apparaît qu'environ 1 h avant son départ et disparaît peu après son arrivée,
# soit une fenêtre de vie de ~1 h 40. Un train manqué pendant cette fenêtre est
# perdu pour toujours — aucun run ultérieur ne le rattrape.
#
# L'ancien rythme (toutes les 4 h) ne voyait donc que les trains passant près
# d'un run : 55 % des trains programmés collectés, et 0 % de ceux partant après
# 18 h, c'est-à-dire précisément les plus en retard. Toutes les 30 min, chaque
# train tombe dans au moins 3 fenêtres d'échantillonnage : il faudrait 3 runs
# consécutifs ratés pour créer un trou. Les crons GitHub sont best-effort, d'où
# cette marge. La fusion par date de service reste idempotente (pas de double
# comptage), et le bloc `coverage` de chaque journée rend toute lacune visible.
#
# Hors circulation, collect.py sort sans rien écrire : pas de commit vide la nuit.
on:
  schedule:
    - cron: '*/30 * * * *'  # toutes les 30 min (UTC), toute l'année (DST incluse)
  workflow_dispatch:

# Moindre privilège : contents pour committer history/ et stats/.
permissions:
  contents: write

# Deux runs simultanés pousseraient des commits concurrents.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dépendances
        run: pip install -r tools/requirements.txt

      - name: Collecte + stats
        run: python tools/collect.py

      # Rend la complétude lisible dans le résumé du run : une lacune se voit tout
      # de suite, au lieu d'attendre qu'un pourcentage à l'heure paraisse trop beau.
      - name: Audit de couverture
        if: always()
        run: |
          {
            echo '## Couverture de la collecte'
            echo
            echo '```'
            python tools/audit.py --days 3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit si changement
        run: |
          git add history stats
          if git diff --cached --quiet; then
            echo "aucun changement"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: ponctualité du $(date -u +'%F %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
